<!doctype html>
<html lang="fa-IR" dir="rtl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#09090b">
        <title>اتصال اینترنت قطع است | PlayNexus</title>
        <style>
            :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                color: #f4f4f5;
                background:
                    radial-gradient(circle at 20% 10%, rgba(99, 102, 241, .2), transparent 35%),
                    radial-gradient(circle at 80% 90%, rgba(168, 85, 247, .15), transparent 32%),
                    #09090b;
            }
            main {
                width: min(90%, 30rem);
                padding: 2.5rem 2rem;
                text-align: center;
                border: 1px solid rgba(255, 255, 255, .1);
                border-radius: 1.5rem;
                background: rgba(24, 24, 27, .78);
                box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, .35);
                backdrop-filter: blur(1rem);
            }
            img { width: 5rem; height: 5rem; border-radius: 1.25rem; }
            h1 { margin: 1.25rem 0 .5rem; font-size: clamp(1.5rem, 6vw, 2rem); }
            p { margin: 0; color: #a1a1aa; line-height: 1.9; }
            button {
                margin-top: 1.75rem;
                padding: .8rem 1.5rem;
                color: white;
                font: inherit;
                font-weight: 700;
                border: 0;
                border-radius: .85rem;
                background: linear-gradient(135deg, #6366f1, #8b5cf6);
                cursor: pointer;
            }
            button:focus-visible { outline: .2rem solid #c4b5fd; outline-offset: .2rem; }
        </style>
    </head>
    <body>
        <main>
            <img src="/logo.png" alt="PlayNexus">
            <h1>فعلاً آفلاین هستید</h1>
            <p>اتصال اینترنت را بررسی کنید و دوباره تلاش کنید. به محض برقراری ارتباط می‌توانید به فروشگاه برگردید.</p>
            <button type="button" onclick="window.location.reload()">تلاش دوباره</button>
        </main>
    </body>
</html>
