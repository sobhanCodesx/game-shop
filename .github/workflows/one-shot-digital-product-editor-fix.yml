name: One-shot digital product form fix
on:
  push:
    branches: [fix/digital-product-relaxed-validation-editor]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        shell: python
        run: |
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'expected block missing: {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,1))
          c='app/Http/Controllers/Admin/DigitalProductController.php'
          rep(c,'use App\\Services\\MediaStorage;\n','use App\\Services\\MediaStorage;\nuse App\\Support\\RichText;\n')
          rep(c,"'short_description' => $data['short_description'] ?? null,","'short_description' => RichText::sanitize($data['short_description'] ?? null),")
          rep(c,"'short_description' => $data['short_description'] ?? null,","'short_description' => RichText::sanitize($data['short_description'] ?? null),")
          rep(c,"$this->syncOffers($product, $data['offers']);","$this->syncOffers($product, $data['offers'] ?? []);")
          rep(c,"$this->syncMedia($product, $data['media']);","$this->syncMedia($product, $data['media'] ?? []);")
          rep(c,"$this->syncOffers($digitalProduct, $data['offers']);","$this->syncOffers($digitalProduct, $data['offers'] ?? []);")
          rep(c,"$this->syncMedia($digitalProduct, $data['media']);","$this->syncMedia($digitalProduct, $data['media'] ?? []);")
          rep(c,"'short_description' => ['nullable', 'string', 'max:500'],","'short_description' => ['nullable', 'string', 'max:50000'],")
          rep(c,"'support_days' => ['required', 'integer', 'min:0', 'max:365'],","'support_days' => ['required', 'integer', 'min:0', 'max:3650'],")
          rep(c,"'offers' => ['required', 'array', 'size:4'],","'offers' => ['nullable', 'array', 'max:4'],")
          rep(c,"'media' => ['required', 'array', 'min:1', 'max:12'],","'media' => ['nullable', 'array', 'max:12'],")
          rep(c,"""\n        foreach ($data['offers'] as $index => $offer) {\n            if (($offer['status'] ?? null) === 'active' && (int) ($offer['price'] ?? 0) < 1) {\n                throw ValidationException::withMessages([\n                    \"offers.{$index}.price\" => 'قیمت فروش ظرفیت فعال باید بیشتر از صفر باشد.',\n                ]);\n            }\n        }\n""",'\n')
          rep(c,"""\n        $hasImage = false;\n        foreach ($data['media'] as $index => $media) {\n            if (($media['type'] ?? null) === 'image') {\n                $hasImage = true;\n            }\n""","""\n        foreach ($data['media'] ?? [] as $index => $media) {\n""")
          rep(c,"""\n        if (! $hasImage) {\n            throw ValidationException::withMessages([\n                'media' => 'حداقل یک تصویر برای محصول دیجیتال لازم است.',\n            ]);\n        }\n""",'\n')
          rep(c,"""\n            if ($attribute->is_required && count($items) === 0) {\n                throw ValidationException::withMessages([\n                    \"attribute_values.{$attribute->id}\" => \"ویژگی {$attribute->title} الزامی است.\",\n                ]);\n            }\n""",'\n')
          f='resources/js/Pages/Admin/Digital/Products/Form.tsx'
          rep(f,'import ProductMediaUploader, {\n    type ProductMediaItem,\n} from "../../../../Components/Admin/Form/ProductMediaUploader";\n','import ProductMediaUploader, {\n    type ProductMediaItem,\n} from "../../../../Components/Admin/Form/ProductMediaUploader";\nimport RichTextEditor from "../../../../Components/Admin/Form/RichTextEditor";\n')
          rep(f,'''                                <textarea\n                                    className="mt-2 min-h-24 w-full rounded-2xl border border-slate-700 bg-slate-950 p-3 text-sm outline-none focus:border-indigo-500"\n                                    value={form.data.short_description}\n                                    onChange={(event) =>\n                                        form.setData(\n                                            "short_description",\n                                            event.target.value,\n                                        )\n                                    }\n                                />''','''                                <div className="mt-2">\n                                    <RichTextEditor\n                                        minHeight={180}\n                                        value={form.data.short_description}\n                                        onChange={(value) => form.setData("short_description", value)}\n                                    />\n                                </div>''')
          rep(f,'                                    کاور، اسکرین‌شات و ویدیو. یک تصویر کاور اصلی انتخاب کن.','                                    کاور، اسکرین‌شات و ویدیو اختیاری‌اند؛ هر زمان خواستی اضافه کن.')
          rep(f,'                        بعضی اطلاعات معتبر نیست. مدیا، ویژگی‌ها و قیمت‌ها را بررسی کن.','                        بعضی اطلاعات از نظر ساختاری معتبر نیست؛ فیلد مشخص‌شده را بررسی کن.')
          s='resources/js/Pages/Digital/Show.tsx'
          rep(s,'''                                            <p className="text-sm leading-8 text-[var(--store-muted)]">\n                                                {product.short_description}\n                                            </p>''','''                                            <div\n                                                className="prose prose-invert max-w-none text-sm leading-8 text-[var(--store-muted)] prose-headings:text-[var(--store-text)] prose-a:text-indigo-400 prose-strong:text-[var(--store-text)]"\n                                                dangerouslySetInnerHTML={{ __html: product.short_description }}\n                                            />''')
          Path('.github/workflows/one-shot-digital-product-editor-fix.yml').unlink()
      - run: php -l app/Http/Controllers/Admin/DigitalProductController.php
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan test tests/Feature/DigitalCommerceTest.php
      - run: npm ci
      - run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Relax digital product validation and add rich text editor"
          git push
