name: MTProto Composer Lock

on:
  push:
    branches:
      - feature/telegram-mtproto-large-files
    paths:
      - '.github/workflows/mtproto-composer-lock.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-mtproto-large-files
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, fileinfo, filter, hash, json, xml, zlib
          tools: composer:v2
      - name: Resolve pinned MadelineProto dependency
        run: composer update danog/madelineproto --with-all-dependencies --no-interaction --no-progress
      - name: Commit lock file
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(telegram): lock MadelineProto dependencies [skip ci]"
          git push origin HEAD:feature/telegram-mtproto-large-files
