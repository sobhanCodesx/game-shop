name: Bootstrap MadelineProto Dependency

on:
  push:
    branches:
      - feature/telegram-mtproto-large-files
    paths:
      - '.github/workflows/mtproto-dependency-bootstrap.yml'

permissions:
  contents: write

jobs:
  composer:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-mtproto-large-files
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, fileinfo, openssl, iconv
          tools: composer:v2
      - name: Add MadelineProto
        run: composer require danog/madelineproto:^8.0 --with-all-dependencies --no-interaction --no-progress
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          git diff --cached --quiet && exit 0
          git commit -m "build(telegram): add MadelineProto dependency"
          git push origin HEAD:feature/telegram-mtproto-large-files
