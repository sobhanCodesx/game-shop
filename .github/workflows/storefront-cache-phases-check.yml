name: Storefront Cache Phases Check

on:
  push:
    branches:
      - feature/storefront-cache-phases
    paths:
      - 'app/Http/Controllers/ChannelController.php'
      - 'app/Http/Controllers/SocialContentController.php'
      - 'app/Http/Controllers/HomeController.php'
      - 'app/Http/Controllers/StudioController.php'
      - 'app/Http/Controllers/ProductController.php'
      - 'app/Http/Controllers/SitemapController.php'
      - 'app/Http/Controllers/Admin/VideoController.php'
      - 'app/Observers/**'
      - 'app/Providers/AppServiceProvider.php'
      - 'app/Services/StorefrontPageCache.php'
      - 'app/Services/PlaylistPageDataService.php'
      - 'app/Services/ChannelPageDataService.php'
      - 'app/Services/ShortPageDataService.php'
      - 'app/Services/HomePublicCacheService.php'
      - 'app/Services/StudioPageDataService.php'
      - 'app/Services/ProductPageDataService.php'
      - 'app/Services/ContentAgentService.php'
      - 'resources/js/**'
      - 'tests/Feature/StorefrontCachePhase*.php'
      - '.github/workflows/storefront-cache-phases-check.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'resources/js/**'
      - 'tests/Feature/StorefrontCachePhase*.php'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          php -l app/Http/Controllers/ChannelController.php
          php -l app/Observers/GameObserver.php
          php -l app/Observers/SocialContentObserver.php
          php -l app/Observers/VideoPlaylistObserver.php
          php -l app/Providers/AppServiceProvider.php
          php -l app/Services/StorefrontPageCache.php
          php -l app/Services/PlaylistPageDataService.php
          php -l app/Services/ChannelPageDataService.php
          php -l app/Observers/SocialContentMediaObserver.php
          php -l app/Observers/StudioObserver.php
          php -l app/Http/Controllers/SocialContentController.php
          php -l app/Http/Controllers/VideoCommunityController.php
          php -l app/Services/ShortPageDataService.php
          php -l tests/Feature/StorefrontCachePhaseOneTest.php
          php -l tests/Feature/StorefrontCachePhaseTwoTest.php
          php -l tests/Feature/StorefrontCachePhaseThreeTest.php tests/Feature/StorefrontCachePhaseFourTest.php tests/Feature/StorefrontCachePhaseFiveTest.php
          php -l app/Services/HomePublicCacheService.php
          php -l app/Observers/HomeSlideObserver.php
          php -l app/Observers/CategoryObserver.php
          php -l app/Observers/ProductMediaObserver.php
          php -l tests/Feature/StorefrontCachePhaseFourTest.php
          php -l app/Services/StudioPageDataService.php
          php -l tests/Feature/StorefrontCachePhaseFiveTest.php

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run phase regression tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test tests/Feature/StorefrontCachePhaseOneTest.php tests/Feature/StorefrontCachePhaseTwoTest.php tests/Feature/StorefrontCachePhaseThreeTest.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend bundles
        run: npm run build
