name: One-shot align digital title integrity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-align-digital-title-integrity.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep game optional while protecting required database title
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/Http/Controllers/Admin/DigitalProductController.php')
          s=p.read_text()
          old="$title=trim((string)($data['title']??''))?:($game?\"{$game->name} - {$platform->name}\":'محصول دیجیتال');"
          new="$title=trim((string)($data['title']??''))?:($game?\"{$game->name} - {$platform->name}\":'');\n        if($title==='') throw ValidationException::withMessages(['title'=>'اگر بازی انتخاب نمی‌کنی، فقط عنوان محصول را وارد کن.']);"
          if s.count(old) != 2:
              raise SystemExit(f'expected 2 title fallbacks, found {s.count(old)}')
          p.write_text(s.replace(old,new))
      - name: Validate
        run: |
          php -l app/Http/Controllers/Admin/DigitalProductController.php
          composer install --no-interaction --prefer-dist --no-progress
          php artisan test tests/Feature/DigitalCommerceTest.php tests/Feature/DigitalProductFormRelaxedValidationTest.php tests/Feature/DigitalProductNoStrictPricingTest.php
          npm ci
          npm run build
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/Admin/DigitalProductController.php
          git commit -m "Keep digital game optional with safe title fallback"
          git push origin HEAD:main
