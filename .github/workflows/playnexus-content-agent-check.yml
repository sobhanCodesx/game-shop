name: PlayNexus Content Agent Check

on:
  push:
    paths:
      - 'composer.json'
      - 'composer.lock'
      - 'app/Http/Controllers/Api/ContentAgentMcpController.php'
      - 'app/Http/Middleware/AuthenticateContentAgent.php'
      - 'app/Services/ContentAgentService.php'
      - 'app/Services/ContentAgentMediaService.php'
      - 'app/Models/ContentAsset.php'
      - 'database/migrations/2026_09_18_090000_create_content_assets_table.php'
      - 'config/content_agent.php'
      - 'scripts/playnexus_publish.py'
      - 'tests/Feature/ContentAgentMcpTest.php'
      - '.github/workflows/playnexus-content-agent-check.yml'
  pull_request:
    paths:
      - 'composer.json'
      - 'composer.lock'
      - 'app/Http/Controllers/Api/ContentAgentMcpController.php'
      - 'app/Http/Middleware/AuthenticateContentAgent.php'
      - 'app/Services/ContentAgentService.php'
      - 'app/Services/ContentAgentMediaService.php'
      - 'app/Models/ContentAsset.php'
      - 'database/migrations/2026_09_18_090000_create_content_assets_table.php'
      - 'config/content_agent.php'
      - 'scripts/playnexus_publish.py'
      - 'tests/Feature/ContentAgentMcpTest.php'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l app/Http/Controllers/Api/ContentAgentMcpController.php
          php -l app/Http/Middleware/AuthenticateContentAgent.php
          php -l app/Services/ContentAgentService.php
          php -l app/Services/ContentAgentMediaService.php
          php -l app/Models/ContentAsset.php
          php -l database/migrations/2026_09_18_090000_create_content_assets_table.php
          php -l config/content_agent.php
          php -l tests/Feature/ContentAgentMcpTest.php
      - name: Python syntax
        run: python3 -m py_compile scripts/playnexus_publish.py
      - name: Validate Composer files
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run content agent feature tests
        run: php artisan test tests/Feature/ContentAgentMcpTest.php
