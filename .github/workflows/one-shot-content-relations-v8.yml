name: One-shot content relations v8

on:
  push:
    branches:
      - chatgpt/content-relations
    paths:
      - .github/workflows/one-shot-content-relations-v8.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/content-relations
          fetch-depth: 0

      - name: Apply stable relation patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/one-shot-content-relations-v7.yml').read_text()
          start = source.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = source.index("\n          PY", start)
          outer = textwrap.dedent(source[start:end])

          final_exec = "exec(compile(script, '<content-relations-patch>', 'exec'))"
          if outer.count(final_exec) != 1:
              raise SystemExit('v7 final exec marker missing')

          graph_fix = r'''
          rel_start = script.index('relation_marker =')
          rel_end = script.index('text = text.replace(\n    "            \'gameId\' => [\'type\' => Type::id()],', rel_start)
          actual_relation = """                'relatedProduct' => [
                      'type' => $this->productType(),
                      'resolve' => fn (SocialContent $content) => $content->relationLoaded('relatedProduct')
                          ? $content->relatedProduct
                          : $content->relatedProduct()->first(),
                  ],"""
          digital_relation = actual_relation + """
                  'relatedDigitalProduct' => [
                      'type' => $this->digitalProductType(),
                      'resolve' => fn (SocialContent $content) => $content->relationLoaded('relatedDigitalProduct')
                          ? $content->relatedDigitalProduct
                          : $content->relatedDigitalProduct()->first(),
                  ],"""
          graph_relation_patch = "actual_relation = " + repr(actual_relation) + "\ndigital_relation = " + repr(digital_relation) + "\nif actual_relation not in text: raise SystemExit('Graph actual relatedProduct block missing')\ntext = text.replace(actual_relation, digital_relation, 1)\n"
          script = script[:rel_start] + graph_relation_patch + script[rel_end:]
          exec(compile(script, '<content-relations-patch>', 'exec'))
          '''
          outer = outer.replace(final_exec, textwrap.dedent(graph_fix).strip(), 1)
          exec(compile(outer, '<v7-with-graph-fix>', 'exec'))
          PY

      - name: Verify PHP syntax
        run: |
          for f in app/Models/SocialContent.php app/Models/Product.php app/Models/DigitalProduct.php app/Http/Controllers/Admin/FeedPostController.php app/Http/Controllers/Admin/VideoController.php app/Http/Requests/Admin/FeedPostRequest.php app/Http/Requests/Admin/VideoRequest.php app/Services/FeedService.php app/Services/GraphQL/PlayNexusGraphSchemaFactory.php app/Services/GraphQL/PlayNexusGraphRepository.php app/Services/GraphQL/PlayNexusGraphService.php database/migrations/2026_10_04_083000_add_related_digital_product_to_social_contents.php; do php -l "$f"; done

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run GraphQL regression
        run: php artisan test tests/Feature/ContentAgentGraphqlTest.php

      - name: Verify frontend build
        run: |
          npm ci
          npm run build

      - name: Guard behavior
        run: |
          grep -q "relatedDigitalProduct" app/Models/SocialContent.php
          grep -q "مشاهده و خرید" resources/js/Components/Storefront/Feed/FeedItem.tsx
          grep -q "playlists->first()?->logo" app/Services/FeedService.php
          grep -q "related_digital_product_id" resources/js/Pages/Admin/Feed/Form.tsx
          grep -q "related_digital_product_id" resources/js/Pages/Admin/Videos/Form.tsx
          grep -q "digitalProductId" app/Services/GraphQL/PlayNexusGraphSchemaFactory.php

      - name: Commit and clean temporary workflows
        run: |
          rm .github/workflows/one-shot-content-relations*.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Link feed and videos to games and all products"
          git push origin HEAD:chatgpt/content-relations
