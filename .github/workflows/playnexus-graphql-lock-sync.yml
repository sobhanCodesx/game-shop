name: PlayNexus GraphQL Dependency Sync

on:
  push:
    branches:
      - chatgpt_dev
    paths:
      - 'composer.json'
      - '.github/workflows/playnexus-graphql-lock-sync.yml'

permissions:
  contents: write

concurrency:
  group: playnexus-graphql-lock-sync
  cancel-in-progress: false

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chatgpt_dev
        uses: actions/checkout@v4
        with:
          ref: chatgpt_dev
          fetch-depth: 0

      - name: Update GraphQL dependency lock
        run: composer update webonyx/graphql-php --with-dependencies --no-install --no-interaction --no-progress --no-scripts

      - name: Commit composer.lock if needed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore(graph): sync GraphQL composer lock"

          git fetch origin chatgpt_dev
          git rebase origin/chatgpt_dev
          git push origin HEAD:chatgpt_dev
