name: One-shot content relations cleanup

on:
  push:
    branches:
      - chatgpt/content-relations
    paths:
      - .github/workflows/one-shot-content-relations-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/content-relations
          fetch-depth: 0
      - name: Remove generated cache artifacts
        shell: bash
        run: |
          git diff --name-only --diff-filter=A origin/main...HEAD -- 'storage/framework/cache/data/*' | while read -r path; do
            [ -n "$path" ] && rm -f -- "$path"
          done
          rm -f .github/workflows/one-shot-content-relations-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated test cache artifacts"
          git push origin HEAD:chatgpt/content-relations
