name: One Shot Clean Deploy Chunk Patch

on:
  push:
    branches:
      - fix/deploy-chunk-compat-20261004
    paths:
      - '.github/workflows/one-shot-clean-deploy-chunk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/deploy-chunk-compat-20261004
          fetch-depth: 0
      - run: |
          rm -rf scripts/__pycache__
          rm .github/workflows/one-shot-clean-deploy-chunk.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary deploy patch artifacts'
          git push origin HEAD:fix/deploy-chunk-compat-20261004
