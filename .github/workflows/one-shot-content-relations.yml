      - name: Guard requested behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          checks = {
              'app/Models/SocialContent.php': ['relatedDigitalProduct', 'related_digital_product_id'],
              'app/Services/FeedService.php': ["'kind' => 'digital'", "playlists->first()?->logo", "route('digital.show'"],
              'resources/js/Components/Storefront/Feed/FeedItem.tsx': ['مشاهده و خرید', 'item.related_product.label', 'ShoppingBag'],
              'resources/js/Pages/Admin/Feed/Form.tsx': ['related_digital_product_id', 'دیجیتال ·'],
              'resources/js/Pages/Admin/Videos/Form.tsx': ['related_digital_product_id', 'اکانت‌های دیجیتال'],
              'app/Services/GraphQL/PlayNexusGraphSchemaFactory.php': ['relatedDigitalProduct', 'digitalProductId'],
          }
          for path, needles in checks.items():
              text = Path(path).read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{needle!r} missing from {path}')
          PY

