name: Diagnose deployment upload completion

on:
  push:
    branches:
      - diag/deploy-complete-20261004
    paths:
      - '.github/workflows/diag-deployment-complete.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ROOT_TOKEN: ${{ secrets.PLAYNEXUS_CONTENT_AGENT_TOKEN }}
      API_BASE: https://playnexus.ir/api/deployment-agent
      SOURCE_SHA: b81f3e5052866bdf1696c10d5a5f4688b45acd50
    steps:
      - name: Probe deployment agent health and tiny upload
        shell: bash
        run: |
          set -Eeuo pipefail
          TOKEN="$(python3 - <<'PY'
          import hashlib,hmac,os
          root=os.environ['ROOT_TOKEN'].encode()
          print(hmac.new(root,b'playnexus/deployment-auth/v1',hashlib.sha256).hexdigest())
          PY
          )"

          HEALTH_HTTP="$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/json' \
            "$API_BASE/health?expected_sha=$SOURCE_SHA" || true)"
          echo "health_http=$HEALTH_HTTP"
          cat /tmp/health.json || true
          echo

          printf 'playnexus deployment diagnostic %s\n' "$(date -u +%s)" > /tmp/diag.bin
          UPLOAD_HTTP="$(curl -sS -o /tmp/chunk.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/json' \
            -H "X-PlayNexus-Deploy-SHA: $SOURCE_SHA" \
            -H "X-PlayNexus-Deploy-Run: $GITHUB_RUN_ID" \
            -F 'operation_id=' \
            -F 'chunk_index=0' \
            -F 'total_chunks=1' \
            -F "size=$(stat -c%s /tmp/diag.bin)" \
            -F 'name=diag.bin' \
            -F "source_sha=$SOURCE_SHA" \
            -F 'source_ref=refs/heads/main' \
            -F "run_id=$GITHUB_RUN_ID" \
            -F 'chunk=@/tmp/diag.bin;type=application/octet-stream' \
            "$API_BASE/upload/chunk" || true)"
          echo "upload_http=$UPLOAD_HTTP"
          cat /tmp/chunk.json || true
          echo

          if [[ "$UPLOAD_HTTP" =~ ^2 ]]; then
            OP_ID="$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/chunk.json'))
          print(data.get('id',''))
          PY
            )"
            echo "operation_id=$OP_ID"
            COMPLETE_HTTP="$(curl -sS -o /tmp/complete.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "{\"operation_id\":\"$OP_ID\"}" \
              "$API_BASE/upload/complete" || true)"
            echo "complete_http=$COMPLETE_HTTP"
            cat /tmp/complete.json || true
            echo
          fi

          [[ "$HEALTH_HTTP" =~ ^2|503$ ]] || exit 1
