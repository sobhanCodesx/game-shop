name: PlayNexus CDN Diagnose

on:
  push:
    branches:
      - chatgpt_dev
    paths:
      - '.github/workflows/playnexus-cdn-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PlayNexus CDN and origin assets
        shell: bash
        run: |
          set -u
          urls=(
            "https://cdnpn.ir/storage/games/covers/36b79703-842f-496f-b7aa-cef657f54f57.webp"
            "https://cdnpn.ir/storage/games/backgrounds/c3f4f739-7aa8-40ea-9435-c31ede112f0e.webp"
            "https://playnexus.ir/storage/games/covers/36b79703-842f-496f-b7aa-cef657f54f57.webp"
            "https://playnexus.ir/storage/games/backgrounds/c3f4f739-7aa8-40ea-9435-c31ede112f0e.webp"
          )
          for url in "${urls[@]}"; do
            echo "===== $url ====="
            rm -f /tmp/body /tmp/headers
            curl -sS -L --max-time 15 -o /tmp/body -D /tmp/headers -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download} IP=%{remote_ip} SSL=%{ssl_verify_result}\n' "$url" || true
            cat /tmp/headers 2>/dev/null || true
            if [[ -f /tmp/body ]]; then
              echo "BODY_BYTES=$(wc -c < /tmp/body)"
            else
              echo "BODY_BYTES=0"
            fi
            echo
          done
