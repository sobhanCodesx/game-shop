name: One Shot Deploy Chunk Compatibility

on:
  push:
    branches:
      - fix/deploy-chunk-compat-20261004
    paths:
      - '.github/workflows/one-shot-deploy-chunk-compat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/deploy-chunk-compat-20261004
          fetch-depth: 0

      - name: Lower HTTPS deployment chunk size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/playnexus_deploy.py')
          text = path.read_text()
          old = 'CHUNK_SIZE = 1024 * 1024'
          new = '# Stay comfortably below shared-host POST/upload limits including multipart overhead.\nCHUNK_SIZE = 512 * 1024'
          if old not in text:
              raise SystemExit('expected CHUNK_SIZE anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 -m py_compile scripts/playnexus_deploy.py
          grep -q 'CHUNK_SIZE = 512 \* 1024' scripts/playnexus_deploy.py

      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-deploy-chunk-compat.yml

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden production deployment chunk uploads'
          git push origin HEAD:fix/deploy-chunk-compat-20261004
