name: Storefront Main Baseline Audit

on:
  push:
    branches:
      - audit/storefront-cache-main-baseline
    paths:
      - '.github/workflows/storefront-main-baseline-audit.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: inertia_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend and SSR bundles
        run: |
          npm run build
          test -s public/build/manifest.json
          test -s bootstrap/ssr/ssr.js

      - name: Run full backend baseline
        run: php artisan test
