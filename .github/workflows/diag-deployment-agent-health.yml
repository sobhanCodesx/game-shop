name: Diagnose Deployment Agent Health

on:
  push:
    branches:
      - diag/deployment-agent-health-20261004
    paths:
      - '.github/workflows/diag-deployment-agent-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYNEXUS_CONTENT_AGENT_TOKEN: ${{ secrets.PLAYNEXUS_CONTENT_AGENT_TOKEN }}
      BASE_URL: https://playnexus.ir/api/deployment-agent
    steps:
      - name: Verify secret exists
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${PLAYNEXUS_CONTENT_AGENT_TOKEN:-}"

      - name: Derive scoped deployment bearer
        shell: bash
        run: |
          set -Eeuo pipefail
          BEARER="$(python3 - <<'PY'
          import hashlib, hmac, os
          token = os.environ['PLAYNEXUS_CONTENT_AGENT_TOKEN'].strip().encode()
          print(hmac.new(token, b'playnexus/deployment-auth/v1', hashlib.sha256).hexdigest())
          PY
          )"
          echo "DEPLOY_BEARER=${BEARER}" >> "$GITHUB_ENV"

      - name: Probe authentication boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          bad="$(curl -sS -o /tmp/bad.json -w '%{http_code}' -H 'Authorization: Bearer invalid' -H 'Accept: application/json' "${BASE_URL}/health" || true)"
          echo "BAD_BEARER_HTTP=${bad}"
          cat /tmp/bad.json || true

      - name: Query authenticated deployment health
        shell: bash
        run: |
          set -Eeuo pipefail
          code="$(curl -sS -L \
            -H "Authorization: Bearer ${DEPLOY_BEARER}" \
            -H 'Accept: application/json' \
            -o /tmp/health.json \
            -w '%{http_code}' \
            "${BASE_URL}/health" || true)"
          echo "HEALTH_HTTP=${code}"
          cat /tmp/health.json || true

      - name: Probe validation path without chunk
        shell: bash
        run: |
          set -Eeuo pipefail
          code="$(curl -sS -L -X POST \
            -H "Authorization: Bearer ${DEPLOY_BEARER}" \
            -H 'Accept: application/json' \
            -o /tmp/validation.json \
            -w '%{http_code}' \
            "${BASE_URL}/upload/chunk" || true)"
          echo "VALIDATION_HTTP=${code}"
          cat /tmp/validation.json || true

      - name: Probe tiny valid first chunk
        shell: bash
        run: |
          set -Eeuo pipefail
          OP="$(python3 - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"
          printf 'PK\003\004diagnostic' > /tmp/probe.zip
          SHA="0000000000000000000000000000000000000000"
          code="$(curl -sS -L \
            -H "Authorization: Bearer ${DEPLOY_BEARER}" \
            -H 'Accept: application/json' \
            -o /tmp/chunk.json \
            -w '%{http_code}' \
            -F "operation_id=${OP}" \
            -F 'chunk_index=0' \
            -F 'total_chunks=1' \
            -F "size=$(stat -c%s /tmp/probe.zip)" \
            -F 'name=diagnostic-probe.zip' \
            -F "source_sha=${SHA}" \
            -F 'source_ref=refs/heads/main' \
            -F "run_id=${GITHUB_RUN_ID}" \
            -F 'chunk=@/tmp/probe.zip;type=application/zip' \
            "${BASE_URL}/upload/chunk" || true)"
          echo "VALID_CHUNK_HTTP=${code}"
          cat /tmp/chunk.json || true
          echo "PROBE_OPERATION=${OP}"
