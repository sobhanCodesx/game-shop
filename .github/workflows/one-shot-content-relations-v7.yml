name: One-shot content relations v7

on:
  push:
    branches:
      - chatgpt/content-relations
    paths:
      - .github/workflows/one-shot-content-relations-v7.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/content-relations
          fetch-depth: 0

      - name: Apply stable relation patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/one-shot-content-relations.yml').read_text()
          start = source.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = source.index("\n          PY", start)
          script = textwrap.dedent(source[start:end])
          script = script.replace("    3,\n)\nreplace(\n    'app/Http/Controllers/Admin/VideoController.php',", "    2,\n)\nreplace(\n    'app/Http/Controllers/Admin/VideoController.php',", 1)

          author_start = script.index('old_author =')
          author_end = script.index('old_product =', author_start)
          old_author = "        $isEditorialPost = $content->type === 'post';\n        $authorName = $isEditorialPost\n            ? 'PlayNexus'\n            : ($content->game?->name ?? 'PlayNexus');\n        $channelLogo = ! $isEditorialPost && $content->game\n            ? ($content->game->cover ?: $content->game->playlists->first()?->logo)\n            : null;"
          new_author = "        $authorName = $content->game?->name ?? 'PlayNexus';\n        $channelLogo = $content->game\n            ? ($content->game->playlists->first()?->logo ?: $content->game->cover)\n            : null;"
          old_url = "                'url' => $isEditorialPost\n                    ? null\n                    : ($content->game ? route('channels.show', $content->game->slug, false) : null),"
          new_url = "                'url' => $content->game ? route('channels.show', $content->game->slug, false) : null,"
          fix = "old_author = " + repr(old_author) + "\nnew_author = " + repr(new_author) + "\nif text.count(old_author) != 2: raise SystemExit('author blocks missing')\ntext = text.replace(old_author, new_author)\nold_author_url = " + repr(old_url) + "\nnew_author_url = " + repr(new_url) + "\nif text.count(old_author_url) != 2: raise SystemExit('author url blocks missing')\ntext = text.replace(old_author_url, new_author_url)\n"
          script = script[:author_start] + fix + script[author_end:]

          product_start = script.index('old_product =')
          product_end = script.index('helper =', product_start)
          old_product = "            'related_product' => $content->relatedProduct && $content->relatedProduct->status === 'published' && $content->relatedProduct->visibility === 'public' ? [\n                'id' => $content->relatedProduct->id,\n                'title' => $content->relatedProduct->title,\n                'url' => route('products.show', $content->relatedProduct->slug, false),\n                'image_url' => MediaStorage::url($content->relatedProduct->coverMedia?->path),\n                'price' => $content->relatedProduct->discount_price ?: $content->relatedProduct->price,\n            ] : null,"
          fix = "old_product = " + repr(old_product) + "\nif old_product not in text: raise SystemExit('product payload missing')\ntext = text.replace(old_product, \"            'related_product' => $this->relatedProductCard($content),\", 1)\n"
          script = script[:product_start] + fix + script[product_end:]

          fallback_start = script.index('digital_fallback =')
          fallback_end = script.index('text = text.replace(\n    "                \'image_url\' => MediaStorage::url($content->game->cover),"', fallback_start)
          marker = "            } elseif ($content->relatedProduct?->coverMedia?->path) {"
          prefix = "            } elseif ($content->relatedDigitalProduct?->coverMedia?->path) {\n                $media->push([\n                    'id' => -$content->relatedDigitalProduct->id,\n                    'type' => 'image',\n                    'url' => MediaStorage::url($content->relatedDigitalProduct->coverMedia->path),\n                    'thumbnail' => null,\n                    'width' => null,\n                    'height' => null,\n                    'duration' => null,\n                    'alt' => $content->title,\n                ]);\n            } elseif ($content->relatedProduct?->coverMedia?->path) {"
          fix = "fallback_marker = " + repr(marker) + "\ndigital_prefix = " + repr(prefix) + "\nif text.count(fallback_marker) != 1: raise SystemExit('preview fallback missing')\ntext = text.replace(fallback_marker, digital_prefix, 1)\n"
          script = script[:fallback_start] + fix + script[fallback_end:]

          types_start = script.index("types = 'resources/js/types/index.ts'")
          frontend_end = script.index('# Intelligence Graph mirrors the new digital-product edge', types_start)
          frontend = r'''types = 'resources/js/types/index.ts'
          old_types = "        id: number;\n        title: string;\n        url: string;\n        image_url: string | null;\n        price: number;"
          new_types = "        id: number;\n        kind: \"physical\" | \"digital\";\n        label: string;\n        title: string;\n        url: string;\n        image_url: string | null;\n        price: number | null;"
          replace(types, old_types, new_types, 1)

          feed_item = 'resources/js/Components/Storefront/Feed/FeedItem.tsx'
          replace(
              feed_item,
              '    Bookmark,\n    Gamepad2,\n    Heart,\n    Link2,\n    MessageCircle,\n    Package,\n    PlaySquare,\n    Share2,',
              '    ArrowUpLeft,\n    Bookmark,\n    Gamepad2,\n    Heart,\n    Link2,\n    MessageCircle,\n    PlaySquare,\n    Share2,\n    ShoppingBag,\n    Sparkles,',
              1,
          )
          text = read(feed_item)
          cta_start_marker = "                    {item.related_product && (\n"
          cta_end_marker = "                    {item.related_video && (\n"
          cta_start = text.index(cta_start_marker)
          cta_end = text.index(cta_end_marker, cta_start)
          cta_lines = [
              '                    {item.related_product && (',
              '                        <Link',
              '                            className="group relative isolate flex min-w-0 items-center gap-3 overflow-hidden rounded-[22px] border border-indigo-500/30 bg-[linear-gradient(120deg,rgba(67,56,202,.22),rgba(15,23,42,.82)_52%,rgba(6,182,212,.12))] p-3.5 shadow-[0_18px_45px_-30px_rgba(99,102,241,.95)] transition duration-300 hover:-translate-y-0.5 hover:border-indigo-400/60 hover:shadow-[0_22px_55px_-30px_rgba(99,102,241,.9)] sm:col-span-2"',
              '                            href={item.related_product.url}',
              '                        >',
              '                            <span aria-hidden="true" className="pointer-events-none absolute -right-12 -top-16 size-36 rounded-full bg-indigo-500/15 blur-3xl" />',
              '                            <span className="relative grid size-16 shrink-0 place-items-center overflow-hidden rounded-2xl border border-white/10 bg-slate-950/65 text-indigo-300 shadow-lg shadow-black/20">',
              '                                {item.related_product.image_url ? (',
              '                                    <img alt={item.related_product.title} className="size-full object-cover transition duration-500 group-hover:scale-105" loading="lazy" src={item.related_product.image_url} />',
              '                                ) : (',
              '                                    <ShoppingBag size={24} />',
              '                                )}',
              '                            </span>',
              '                            <span className="relative min-w-0 flex-1">',
              '                                <span className="flex flex-wrap items-center gap-1.5">',
              '                                    <small className="inline-flex items-center gap-1 rounded-full border border-indigo-400/20 bg-indigo-500/10 px-2 py-0.5 text-[9px] font-black text-indigo-300">',
              '                                        <Sparkles size={10} />',
              '                                        {item.related_product.label}',
              '                                    </small>',
              '                                    {item.related_product.price !== null ? (',
              '                                        <span className="text-[10px] font-black text-emerald-400">',
              '                                            {item.related_product.kind === "digital" ? "از " : ""}',
              '                                            {money.format(item.related_product.price)} تومان',
              '                                        </span>',
              '                                    ) : (',
              '                                        <span className="text-[9px] font-bold text-amber-300">قیمت و ظرفیت در صفحه محصول</span>',
              '                                    )}',
              '                                </span>',
              '                                <strong className="mt-1.5 block line-clamp-2 text-xs font-black leading-5 text-white sm:text-sm">{item.related_product.title}</strong>',
              '                                <span className="mt-2 inline-flex items-center gap-1.5 rounded-xl bg-indigo-500 px-2.5 py-1.5 text-[10px] font-black text-white shadow-lg shadow-indigo-950/30 transition group-hover:bg-indigo-400">',
              '                                    مشاهده و خرید',
              '                                    <ArrowUpLeft size={13} />',
              '                                </span>',
              '                            </span>',
              '                        </Link>',
              '                    )}',
          ]
          new_cta = "\n".join(cta_lines) + "\n"
          write(feed_item, text[:cta_start] + new_cta + text[cta_end:])

          show = 'resources/js/Pages/Feed/Show.tsx'
          text = read(show)
          text = text.replace('                                                محصول مرتبط\n', '                                                {item.related_product.label}\n', 1)
          old_price = "                                            <span className=\"mt-0.5 block text-[9px] text-[var(--store-muted)]\">\n                                                {money.format(\n                                                    item.related_product.price,\n                                                )}{\" \"}\n                                                تومان\n                                            </span>"
          new_price = "                                            <span className=\"mt-0.5 block text-[9px] text-[var(--store-muted)]\">\n                                                {item.related_product.price !== null\n                                                    ? `${item.related_product.kind === \"digital\" ? \"از \" : \"\"}${money.format(item.related_product.price)} تومان`\n                                                    : \"مشاهده قیمت و ظرفیت‌ها\"}\n                                            </span>"
          if old_price not in text:
              raise SystemExit('feed detail product price block missing')
          write(show, text.replace(old_price, new_price, 1))

          '''
          script = script[:types_start] + textwrap.dedent(frontend) + script[frontend_end:]
          exec(compile(script, '<content-relations-patch>', 'exec'))
          PY

      - name: Verify PHP syntax
        run: |
          for f in app/Models/SocialContent.php app/Models/Product.php app/Models/DigitalProduct.php app/Http/Controllers/Admin/FeedPostController.php app/Http/Controllers/Admin/VideoController.php app/Http/Requests/Admin/FeedPostRequest.php app/Http/Requests/Admin/VideoRequest.php app/Services/FeedService.php app/Services/GraphQL/PlayNexusGraphSchemaFactory.php app/Services/GraphQL/PlayNexusGraphRepository.php app/Services/GraphQL/PlayNexusGraphService.php database/migrations/2026_10_04_083000_add_related_digital_product_to_social_contents.php; do php -l "$f"; done

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run GraphQL regression
        run: php artisan test tests/Feature/ContentAgentGraphqlTest.php

      - name: Verify frontend build
        run: |
          npm ci
          npm run build

      - name: Guard behavior
        run: |
          grep -q "relatedDigitalProduct" app/Models/SocialContent.php
          grep -q "مشاهده و خرید" resources/js/Components/Storefront/Feed/FeedItem.tsx
          grep -q "playlists->first()?->logo" app/Services/FeedService.php
          grep -q "related_digital_product_id" resources/js/Pages/Admin/Feed/Form.tsx
          grep -q "related_digital_product_id" resources/js/Pages/Admin/Videos/Form.tsx
          grep -q "digitalProductId" app/Services/GraphQL/PlayNexusGraphSchemaFactory.php

      - name: Commit and clean temporary workflows
        run: |
          rm .github/workflows/one-shot-content-relations*.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Link feed and videos to games and all products"
          git push origin HEAD:chatgpt/content-relations
